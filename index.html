<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📚 Flashcard Quiz</h1>
        <p class="subtitle">Learn • Practice • Remember</p>

        <div class="card-area">
            <div class="flashcard">
                <div class="question" id="question">
                    Question
                </div>

                <div class="answer" id="answer">
                    Answer
                </div>
            </div>

            <button class="show-btn" onclick="showAnswer()">
                Show Answer
            </button>
        </div>

        <div class="navigation">
            <button onclick="previousCard()">← Previous</button>
            <span id="cardNumber">1 / 3</span>
            <button onclick="nextCard()">Next →</button>
        </div>

        <div class="manage-section">

            <h2>Manage Flashcards</h2>

            <input type="text" id="questionInput"
                   placeholder="Enter question">

            <input type="text" id="answerInput"
                   placeholder="Enter answer">

            <div class="manage-buttons">
                <button onclick="addCard()">Add Card</button>
                <button onclick="editCard()">Edit Card</button>
                <button onclick="deleteCard()">Delete Card</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
